<!doctype html>
<html lang="en">
  <head xmlns:th="https://www.thymeleaf.org">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Book</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
  </head>
  <body>
  	<nav class="navbar navbar-expand-lg  navbar-light bg-dark">
  	
	  <div class="container-fluid">
	    <a class="navbar-brand text-white" href="/">Book Store</a>
	    
	    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
	      <span class="navbar-toggler-icon"></span>
	    </button>
	    
	    <div class="collapse navbar-collapse" id="navbarSupportedContent">
		      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
		        <li class="nav-item">
		          <a class="nav-link active text-white" aria-current="page" href="/">Home</a>
		        </li>
		        <li class="nav-item">
		          <a class="nav-link text-white" aria-current="page" href="/all-books">Available Books</a>
		        </li>
		        <li class="nav-item">
		          <a class="nav-link text-white" href="/my-books">My Books</a>
		        </li>
		      </ul>
		      
		<div>
			<a class="nav-link text-white" aria-current="page" href="/add-book">New Book Register</a>
		</div>

		      
		      
	    </div>
	  </div>
	</nav>
  
    <div class="container border border-primary my-5 p-5 col-md-6">
	    <h1 class="col-md-4 offset-md-4">Edit Book</h1>
		<form th:action="@{/save}" class="col-md-4 offset-md-4" method="post" th:object="${book}">
			  <div class="mb-3">
			    <label for="bookname" class="form-label">Book Name</label>
			    <input type="text" class="form-control" id="bookname" name="bookName" required th:value="${book.bookName}">
			  </div>
			  <div class="mb-3">
			    <label for="authorname" class="form-label">Author Name</label>
			    <input type="text" class="form-control" id="authorname" name="authorName" required th:value="${book.authorName}">
			  </div>
			  <div class="mb-3">
			    <label for="price" class="form-label">Price</label>
			    <input type="number" class="form-control" id="price" name="price" required th:value="${book.price}">
			  </div>
			  
			  <button type="submit" class="btn btn-primary">Update Book</button>
		</form>
    
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
  </body>
</html>
